<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CeX 資料台</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CeX">
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#262b36;
    --fg:#e9edf5; --dim:#8b93a5; --accent:#4da3ff; --good:#5ddc9a; --warn:#ffb454; --bad:#ff6b6b;
    --radius:14px; --tap:44px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:15px;-webkit-text-size-adjust:100%}
  .wrap{max-width:900px;margin:0 auto;padding:0 12px 96px;overflow-x:hidden}
  header{padding:14px 0 8px}
  .title{display:flex;align-items:center;gap:8px}
  .title h1{font-size:18px;margin:0;letter-spacing:.5px;flex:0 0 auto}
  .title .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .title .spacer{flex:1 1 auto}
  .sync{appearance:none;border:1px solid var(--accent);background:rgba(77,163,255,.12);color:var(--accent);
    font-size:13px;font-weight:600;padding:0 14px;height:36px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .sync[disabled]{opacity:.55;cursor:default}
  .sync.busy{border-color:var(--warn);color:var(--warn);background:rgba(255,180,84,.12)}
  .sync.done{border-color:var(--good);color:var(--good);background:rgba(93,220,154,.12)}
  .meta{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.6}
  .meta b{color:var(--fg)}
  .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:8px;display:none}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

  .tabs{display:flex;gap:6px;margin:12px 0 10px}
  .tabs button{flex:1 1 0;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--dim);
    height:var(--tap);border-radius:12px;font-size:14px;cursor:pointer}
  .tabs button.on{background:var(--card2);color:var(--fg);border-color:#3a4152;font-weight:600}

  .ctrls{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 88%,transparent);
    padding:8px 0 10px;margin:0 -12px;padding-left:12px;padding-right:12px}
  .search{position:relative;display:flex}
  .search input{flex:1 1 auto;height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--card);
    color:var(--fg);padding:0 40px 0 14px;font-size:15px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search #clr{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;border:0;
    background:var(--card2);color:var(--dim);font-size:14px;display:none;cursor:pointer}
  .row2{display:flex;gap:6px;margin-top:8px}
  .row2 select{flex:1 1 0;min-width:0;height:var(--tap);border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:14px;padding:0 8px;outline:none}
  .seg{display:flex;gap:6px;margin-top:8px}
  .seg button{flex:1 1 0;appearance:none;height:38px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--dim);font-size:13px;cursor:pointer}
  .seg button.on{background:var(--card2);color:var(--fg);border-color:#3a4152;font-weight:600}
  .count{font-size:12px;color:var(--dim);margin-top:8px}

  .item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
  .item .main{flex:1 1 auto;min-width:0}
  .item .nm{font-size:15px;font-weight:600;line-height:1.35;word-break:break-word}
  .item .sub{font-size:11.5px;color:var(--dim);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
  .item .sub span{white-space:nowrap}
  .item .right{flex:0 0 auto;text-align:right}
  .item .price{font-size:16px;font-weight:700;white-space:nowrap}
  .item .buy{font-size:11.5px;color:var(--dim);margin-top:4px;white-space:nowrap}
  .item .buy.q0{color:var(--bad)}
  .item .buy.q1{color:var(--warn)}
  .item.out{opacity:.62}
  .more{display:block;width:100%;height:var(--tap);border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
  .empty,.err{text-align:center;color:var(--dim);font-size:13.5px;line-height:1.8;padding:28px 12px}
  .err b{color:var(--bad)}
  .dayhd{font-size:12.5px;color:var(--dim);margin:14px 0 6px;font-weight:600}
  .chg{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:9px 11px;margin-bottom:6px}
  .ev{flex:0 0 auto;font-size:11px;border-radius:6px;padding:3px 7px;background:var(--card2);color:var(--dim)}
  .ev.NEW{background:rgba(93,220,154,.16);color:var(--good)}
  .ev.SOLD_OUT,.ev.GONE{background:rgba(255,107,107,.16);color:var(--bad)}
  .ev.PRICE_DOWN{background:rgba(77,163,255,.16);color:var(--accent)}
  .ev.PRICE_UP{background:rgba(255,180,84,.16);color:var(--warn)}
  .chg .txt{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.4;word-break:break-word}
  .chg .txt .n{font-size:11.5px;color:var(--dim);margin-top:3px}
  footer{margin-top:22px;font-size:11.5px;color:var(--dim);line-height:1.8;text-align:center}
.chghd{padding:10px 12px;font-size:13px;line-height:1.5;color:var(--dim);border-bottom:1px solid var(--line)}
.chghd .n{font-size:12px;opacity:.8;margin-top:2px}
.chghd.warn{color:#8a5300;background:rgba(255,193,7,.14)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>CeX</h1>
      <span class="tag" id="ver">uiv11</span>
      <span class="spacer"></span>
      <button class="sync" id="sync">同步遊戲片</button>
    </div>
    <div class="meta" id="meta">載入中…</div>
    <div class="bar" id="bar"><i></i></div>
  </header>

  <div class="tabs" role="tablist">
    <button data-tab="all" class="on">瀏覽</button>
    <button data-tab="new">新上架</button>
    <button data-tab="chg">變動</button>
  </div>

  <div class="ctrls" id="ctrls">
    <div class="search">
      <input id="q" placeholder="搜尋遊戲名稱…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="clr" aria-label="清除">✕</button>
    </div>
    <div class="row2">
      <select id="g1"></select>
      <select id="g2"></select>
      <select id="sort">
        <option value="new">首見 新→舊</option>
        <option value="price-desc">價格 高→低</option>
        <option value="price-asc">價格 低→高</option>
        <option value="name-asc">名稱 A→Z</option>
      </select>
    </div>
    <div class="seg" id="stock">
      <button data-v="all" class="on">全部</button>
      <button data-v="in">有庫存</button>
      <button data-v="out">沒庫存</button>
    </div>
    <div class="count" id="count"></div>
  </div>

  <div id="list"></div>

  <footer>
    資料來源：CeX 公開資料（MY）。買取價＝走進 CeX 可換到的現金。<br>
    這裡只呈現事實，不給建議——判斷留給你。
  </footer>
</div>

<script src="cex.js"></script>
<script src="menu.js"></script>
<!-- 變動判定規則：與電腦端**同一份檔**（ledger-core.mjs，發布時複製成 .js——.mjs 在部分伺服器會被 MIME 擋掉）。
     用 module 載入（deferred）→ 解析完才執行，所以下面的 inline 腳本會先檢查 window.CexDiff。 -->
<script type="module">
  import { diffRows, countByEvent } from './ledger-core.js';
  window.CexDiff = { diffRows: diffRows, countByEvent: countByEvent };
  console.log('[CeX] 共用規則模組已載入（ledger-core.js）');
</script>
<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var PAGE = 100;                                   // 每批顯示幾筆（手機：<200 不必虛擬化）
var S = { tab: 'all', q: '', g1: '', g2: '', sort: 'new', stock: 'all', shown: PAGE, live: null, liveKey: '' };
var CACHE = null;      // 本機遊戲片快取 {at, cols, items}
var SNAP = null;       // 每日快照（全部商品）
var CHANGES = null;

/* ── IndexedDB：存同步下來的遊戲片（1.4 MB，localStorage 裝不下）── */
var IDB = {
  open: function () {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('cex-desk', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  },
  get: async function (k) {
    var db = await IDB.open();
    return new Promise(function (res, rej) {
      var t = db.transaction('kv', 'readonly').objectStore('kv').get(k);
      t.onsuccess = function () { res(t.result); };
      t.onerror = function () { rej(t.error); };
    });
  },
  set: async function (k, v) {
    var db = await IDB.open();
    return new Promise(function (res, rej) {
      var t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
      t.onsuccess = function () { res(); };
      t.onerror = function () { rej(t.error); };
    });
  }
};

/* ── 小工具 ── */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
function fmtRM(n) { return 'RM' + (Number.isInteger(n) ? n : Number(n).toFixed(2)); }
function dmy(t) { var s = String(t || '').slice(0, 10); return s ? s.slice(2).replace(/-/g, '/') : ''; }
function hoursAgo(t) { var d = Date.parse(String(t || '').replace(' ', 'T')); return isNaN(d) ? null : (Date.now() - d) / 3600e3; }
function agoText(iso) {   // ⚠️ 不要剝掉結尾的 Z，否則會被當成本地時間、少算 8 小時
  var d = Date.parse(iso);
  if (isNaN(d)) return '';
  var h = (Date.now() - d) / 3600e3;
  return h < 1 ? Math.round(h * 60) + ' 分鐘前' : h.toFixed(1) + ' 小時前';
}
function toRows(cols, items) {
  var ix = {}; cols.forEach(function (c, i) { ix[c] = i; });
  return items.map(function (r) {
    var o = { boxId: r[ix.boxId], name: r[ix.name], cat: r[ix.cat], price: r[ix.price], cash: r[ix.cash], qty: r[ix.qty], stores: r[ix.stores], first: r[ix.first] };
    o._s = String(o.name || '').toLowerCase();
    return o;
  });
}

/* ── 選單 ── */
function buildMenu() {
  var g1 = $('#g1');
  var html = '<option value="">全部遊戲片</option>';
  MENU.groups.forEach(function (g) {
    if (g.key === 'games') {
      html += '<optgroup label="遊戲片">' + g.platforms.map(function (p) {
        return '<option value="p:' + esc(p.label) + '">' + esc(p.label) + '（' + p.n + '）</option>';
      }).join('') + '</optgroup>';
    } else {
      html += '<optgroup label="' + esc(g.label) + '">' + g.items.map(function (i) {
        return '<option value="c:' + esc(i.cat) + '">' + esc(i.label) + '（' + i.n + '）</option>';
      }).join('') + '</optgroup>';
    }
  });
  g1.innerHTML = html;
  $('#g2').style.display = 'none';
}

function platformOf(label) {
  for (var i = 0; i < MENU.groups[0].platforms.length; i++) {
    if (MENU.groups[0].platforms[i].label === label) return MENU.groups[0].platforms[i];
  }
  return null;
}

function syncG2() {
  var g2 = $('#g2'), v = S.g1;
  S.g2 = '';
  if (v.indexOf('p:') === 0) {
    var p = platformOf(v.slice(2));
    if (p && p.children.length > 1) {
      g2.innerHTML = '<option value="">全部 ' + esc(p.label) + '（' + p.n + '）</option>' +
        p.children.map(function (c) { return '<option value="' + esc(c.cat) + '">' + esc(c.label) + '（' + c.n + '）</option>'; }).join('');
      g2.style.display = '';
      return;
    }
  }
  g2.style.display = 'none';
}

/* ── 目前要顯示的資料 ── */
function baseRows() {
  if (S.tab === 'new') return CACHE ? CACHE : (SNAP || null);
  if (S.g1 === '') return CACHE;                       // 全部遊戲片 → 本機快取
  if (S.g1.indexOf('p:') === 0) return CACHE;          // 平台 → 本機快取
  return null;                                          // 非遊戲片分類 → 需即時查
}

function filtered(rows) {
  if (!rows) return [];
  var out = rows, q = S.q.trim().toLowerCase();
  if (S.tab === 'new') {
    var cut = new Date(Date.now() - 86400e3 + 8 * 3600e3).toISOString().slice(0, 19).replace('T', ' ');
    out = out.filter(function (i) { return String(i.first || '') >= cut; });
  }
  // 有搜尋字時一律跨全部遊戲片（他想找某一款，不該被當前分類綁住）
  if (!q) {
    if (S.g1.indexOf('p:') === 0) {                   // 選了平台但沒選區域 → 只留該平台底下的分類
      var p = S.g1 === '' ? null : platformOf(S.g1.slice(2));
      if (p) {
        var inP = {};
        p.cats.forEach(function (c) { inP[c] = 1; });
        out = out.filter(function (i) { return inP[i.cat]; });
      }
    }
    if (S.g2) out = out.filter(function (i) { return i.cat === S.g2; });
  }
  if (q) out = out.filter(function (i) { return i._s.indexOf(q) >= 0; });
  if (S.stock === 'in') out = out.filter(function (i) { return i.qty > 0; });
  if (S.stock === 'out') out = out.filter(function (i) { return !(i.qty > 0); });
  var s = S.sort;
  out = out.slice().sort(function (a, b) {
    if (s === 'price-desc') return b.price - a.price;
    if (s === 'price-asc') return a.price - b.price;
    if (s === 'name-asc') return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant');
    return String(b.first || '').localeCompare(String(a.first || ''));
  });
  return out;
}

function itemRow(i) {
  var q = i.qty, cls = q <= 0 ? 'q0' : (q <= 1 ? 'q1' : '');
  var subs = [esc(i.cat || '—')];
  if (i.cash > 0) subs.push('買取 ' + fmtRM(i.cash));
  if (i.stores > 0) subs.push(i.stores + ' 家分店');
  if (i.first) subs.push('首見 ' + dmy(i.first));
  subs.push('#' + esc(i.boxId));
  return '<div class="item' + (q <= 0 ? ' out' : '') + '"><div class="main"><div class="nm">' + esc(i.name || '(無名)') + '</div>' +
    '<div class="sub"><span>' + subs.join('</span><span>') + '</span></div></div>' +
    '<div class="right"><div class="price">' + fmtRM(i.price) + '</div>' +
    '<div class="buy ' + cls + '">庫存 ' + q + '</div></div></div>';
}

var EVLABEL = { NEW: '新上架', GONE: '消失', SOLD_OUT: '賣光', RESTOCK: '回架', QTY_UP: '庫存+', QTY_DOWN: '庫存−', PRICE_UP: '漲價', PRICE_DOWN: '降價', STORE_CHANGE: '分店變動' };
function renderChanges() {
  // 來源優先序：① 手機自己算的（有基準時）② 電腦發布的變動帳（只有第一次當種子用）
  var local = (LOC_CHANGES && LOC_CHANGES.rows) ? LOC_CHANGES : null;
  var rows = (local ? local.rows : (CHANGES && CHANGES.rows)) || [];
  var hd = '';
  if (LOC_META && LOC_META.incomplete) {
    hd += '<div class="chghd warn">⚠️ 上次同步只抓到 ' + LOC_META.now + ' 筆（比上次 ' + LOC_META.prev +
      ' 筆少太多）→ 研判抓取中斷，已沿用舊資料、<b>沒有產生任何變動</b>。</div>';
  }
  if (local && LOC_META) {
    // 基準要顯示到「時間」——一天會同步好幾次，只寫日期會看不出相對哪一次
    var when = LOC_META.prevAt
      ? new Date(LOC_META.prevAt).toLocaleString('zh-TW', { timeZone: 'Asia/Kuala_Lumpur', hour12: false }).slice(5, 16)
      : '上次';
    hd += '<div class="chghd">📱 <b>手機自己算的</b>：相對 ' + when +
      ' 的差異（' + rows.length + ' 筆）<div class="n">上次 ' + (LOC_META.from || '?') + ' 筆 → 這次 ' + (LOC_META.to || '?') +
      ' 筆｜只涵蓋遊戲片，不含「分店變動」與「狀態變動」</div></div>';
  } else if (CHANGES && CHANGES.rows) {
    hd += '<div class="chghd">☁ 這是<b>電腦發布</b>的變動帳（手機還沒有自己的基準——按一次「同步遊戲片」就會開始自己算）</div>';
  }
  if (!rows.length) return hd + '<div class="empty">相對上次同步，<b>沒有任何變動</b>。<br><span style="opacity:.72;font-size:12px">CeX 一天動的筆數本來就少，這是正常的（空手而回是常態）。</span></div>';
  var byDay = {};
  rows.forEach(function (r) { var d = dmy(r.t) || '—'; (byDay[d] = byDay[d] || []).push(r); });
  return Object.keys(byDay).map(function (d) {
    return '<div class="dayhd">' + d + '（' + byDay[d].length + ' 筆）</div>' + byDay[d].map(function (r) {
      return '<div class="chg"><span class="ev ' + esc(r.event) + '">' + (EVLABEL[r.event] || esc(r.event)) + '</span>' +
        '<div class="txt">' + esc(r.name || r.boxId) +
        '<div class="n">' + esc(r.cat || '') + (r.old != null && r.new != null ? '　' + esc(r.old) + ' → ' + esc(r.new) : '') + '</div></div></div>';
    }).join('');
  }).join('');
}

function setMeta(html) { $('#meta').innerHTML = html; }

function render() {
  var list = $('#list');
  if (S.tab === 'chg') {
    $('#ctrls').style.display = 'none';
    list.innerHTML = renderChanges();
    return;
  }
  $('#ctrls').style.display = '';

  var rows = S.live ? S.live.items : baseRows();
  if (!rows) {
    // 非遊戲片分類：必須即時查
    if (S.g1.indexOf('c:') === 0) { liveFetch(); return; }
    list.innerHTML = '<div class="empty">本機還沒有資料。<br>按右上角「同步遊戲片」把整個遊戲片分類抓下來（約 20–30 秒），之後就能離線看。</div>';
    $('#count').textContent = '';
    return;
  }
  var out = filtered(rows);
  var cap = Math.min(S.shown, out.length);
  $('#count').textContent = '符合 ' + out.length.toLocaleString() + ' 筆' + (out.length > cap ? '，顯示前 ' + cap : '');
  if (!out.length) {
    list.innerHTML = '<div class="empty">沒有符合的資料。' +
      (S.q.trim() ? '<br>（目前有搜尋字「' + esc(S.q.trim()) + '」，清掉才會看到全部）' : '') +
      '<br>（空手而回是常態，不用硬找。）</div>';
    return;
  }
  var more = out.length > cap
    ? '<button class="more" id="more">載入更多（還有 ' + (out.length - cap).toLocaleString() + ' 筆）</button>' : '';
  list.innerHTML = out.slice(0, cap).map(itemRow).join('') + more;
  var m = $('#more');
  if (m) m.onclick = function () { S.shown += PAGE; render(); };
}

/* ── 即時搜尋（本機找不到時才打 CeX；只留名稱真的吻合的，避開 Algolia 的模糊匹配）── */
async function liveSearch(q) {
  var key = 'q:' + q;
  if (S.live && S.liveKey === key) return;
  var list = $('#list');
  list.innerHTML = '<div class="empty">向 CeX 搜尋中…</div>';
  $('#count').textContent = '';
  try {
    var r = await CEX.query({ q: q, limit: 300, inStockOnly: S.stock === 'in' });
    var words = q.toLowerCase().split(/\s+/).filter(Boolean);
    var hits = r.hits.filter(function (h) {
      var n = String(h.boxName || '').toLowerCase();
      return words.every(function (w) { return n.indexOf(w) >= 0; });
    });
    S.live = { cols: CEX.COLS, items: toRows(CEX.COLS, hits.map(hitToRow)) };
    S.liveKey = key;
    setMeta('即時搜尋 <b>' + esc(q) + '</b>　CeX 回報 ' + r.nbHits.toLocaleString() +
      ' 筆 ／ 名稱吻合 <b>' + hits.length + '</b> 筆' + (r.hits.length >= 300 ? '（只取了前 300 筆）' : ''));
    render();
  } catch (e) {
    list.innerHTML = '<div class="err"><b>搜尋失敗</b><br>' + esc(e.message) + '</div>';
  }
}

/* ── 即時查（非遊戲片分類）── */
async function liveFetch() {
  var cat = S.g1.slice(2);
  var key = cat + '|' + S.stock;
  if (S.live && S.liveKey === key) return render();
  var list = $('#list');
  list.innerHTML = '<div class="empty">向 CeX 查詢中…（第一次約 1–2 秒）</div>';
  $('#count').textContent = '';
  try {
    var r = await CEX.query({ cat: cat, inStockOnly: S.stock === 'in', limit: 1000 });
    S.live = { cols: CEX.COLS, items: toRows(CEX.COLS, r.hits.map(hitToRow)) };
    S.liveKey = key;
    setMeta('即時查詢 · <b>' + esc(cat) + '</b>　共 <b>' + r.nbHits.toLocaleString() + '</b> 筆（現在回傳前 ' + r.hits.length + '）');
    render();
  } catch (e) {
    list.innerHTML = '<div class="err"><b>查詢失敗</b><br>' + esc(e.message) + '</div>';
  }
}
function hitToRow(h) {
  return [h.boxId, h.boxName, h.categoryFriendlyName, h.sellPrice || 0, h.cashPriceCalculated || 0,
    h.collectionQuantity || 0, (h.collectionStores || []).length, h.firstStockDate || ''];
}

/* ── 同步遊戲片 ── */
async function doSync() {
  var btn = $('#sync'), bar = $('#bar');
  if (!MENU.gameCats || !MENU.gameCats.length) return;
  btn.disabled = true; btn.className = 'sync busy'; btn.textContent = '同步中…';
  bar.style.display = 'block';
  var t0 = Date.now();
  try {
    var res = await CEX.fetchCategories(MENU.gameCats, function (p) {
      if (p.phase === 'split') {
        bar.firstChild.style.width = '12%';
        btn.textContent = '準備中…';
      } else {
        var pct = 12 + 88 * (p.done / p.total);
        bar.firstChild.style.width = pct.toFixed(1) + '%';
        btn.textContent = Math.round(pct) + '%';
      }
    });
    var rec = { at: new Date().toISOString(), cols: res.cols, items: res.items };
    var prev = null;
    try { prev = await IDB.get('games'); } catch (e) { prev = null; }
    // ⭐ 完整性守門（2026-10-01）：抓到的筆數明顯少於上次 → 研判抓取中斷。
    //   這種時候**絕不更新基準、也不產生變動**——否則半份資料會被誤報成幾千筆「消失」（假數字）。
    if (prev && prev.items && prev.items.length && res.items.length < prev.items.length * 0.9) {
      LOC_META = { at: new Date().toISOString(), incomplete: true, now: res.items.length, prev: prev.items.length };
      await IDB.set('loc_meta', LOC_META);
      bar.style.display = 'none';
      btn.className = 'sync';
      btn.textContent = '抓取不完整';
      alert('這次只抓到 ' + res.items.length + ' 筆，比上次（' + prev.items.length + ' 筆）少太多，研判是中斷。\n\n已保留上次的基準，不產生任何變動紀錄（舊資料沒有被蓋掉）。');
      render();
      return;
    }
    if (prev && prev.items && prev.items.length) { await IDB.set('games_prev', prev); }
    await IDB.set('games', rec);
    CACHE = toRows(res.cols, res.items);
    // ⭐ 自己算變動——用與電腦**同一份規則**（ledger-core.mjs），只算手機拿得到的欄位
    try {
      if (prev && prev.items && prev.items.length && window.CexDiff) {
        var evs = window.CexDiff.diffRows(toRows(prev.cols, prev.items), CACHE, { fields: { stores: false, status: false } });
        var crow = evs.map(function (e) {
          return { t: new Date().toISOString().slice(0, 19) + 'Z', event: e.event, boxId: e.boxId, name: e.name, cat: e.cat, old: e.oldValue, new: e.newValue };
        });
        LOC_CHANGES = { rows: crow };
        LOC_META = { at: new Date().toISOString(), prevAt: prev.at, from: prev.items.length, to: res.items.length, n: crow.length };
        await IDB.set('loc_changes', LOC_CHANGES);
        await IDB.set('loc_meta', LOC_META);
      } else if (!window.CexDiff) {
        console.warn('共用規則模組還沒載入 → 這一輪不算變動');
      }
    } catch (e) { console.warn('本機變動計算失敗', e); }
    S.live = null;
    btn.textContent = '已同步';
    bar.firstChild.style.width = '100%';
    setTimeout(function () { bar.style.display = 'none'; }, 1200);
    paintMeta('本機同步 · ' + ((Date.now() - t0) / 1000).toFixed(0) + ' 秒、' + res.posts + ' 個請求');
    if (res.mismatches && res.mismatches.length) {
      console.warn('筆數不符：', res.mismatches);
    }
    render();
  } catch (e) {
    btn.className = 'sync';
    btn.textContent = '同步失敗，重試';
    bar.style.display = 'none';
    alert('同步失敗：' + e.message + '\n\n（舊資料還在，沒有被蓋掉）');
  } finally {
    btn.disabled = false;
    if (btn.textContent === '已同步') { btn.className = 'sync done'; setTimeout(function () { btn.textContent = '同步遊戲片'; btn.className = 'sync'; }, 2500); }
  }
}

/* ── 頁首資訊 ── */
function paintMeta(extra) {
  var parts = [];
  if (CACHE) {
    parts.push('本機：<b>' + CACHE.length.toLocaleString() + '</b> 筆遊戲片');
    if (CACHE_AT) parts.push('同步於 ' + new Date(CACHE_AT).toLocaleString('zh-TW', { timeZone: 'Asia/Kuala_Lumpur', hour12: false }).slice(5, 16));
  } else {
    parts.push('本機：<b>尚未同步</b>');
  }
  // 診斷燈（2026-10-01）：一眼看出「與電腦共用的規則模組」有沒有載入。
  // ✗＝模組沒載入（多半是快取舊版或副檔名/MIME 問題）→ 這時手機不會自己算變動。
  parts.push(window.CexDiff ? '規則模組 ✓' : '規則模組 ✗');
  if (CHANGES && CHANGES.generatedAt) parts.push('變動帳 ' + agoText(CHANGES.generatedAt));
  setMeta((extra ? extra + '<br>' : '') + parts.join('　·　'));
}
var CACHE_AT = null;
var LOC_CHANGES = null;   // 手機自己算的變動（IDB loc_changes）
var LOC_META = null;      // 它的基準資訊（IDB loc_meta）：相對哪一次、筆數、是否不完整

/* ── 啟動 ── */
async function boot() {
  buildMenu();
  try {
    var rec = await IDB.get('games');
    if (rec && rec.items && rec.items.length) {
      CACHE = toRows(rec.cols, rec.items);
      CACHE_AT = rec.at;
    }
    // 手機自己算的變動（有就用它，沒有才退回電腦發布的那份）
    var lc = await IDB.get('loc_changes');
    if (lc && lc.rows) { LOC_CHANGES = lc; LOC_META = await IDB.get('loc_meta'); }
  } catch (e) { console.warn('本機快取讀取失敗', e); }
  paintMeta();
  render();

  // 變動帳（背景載入，不擋首屏）
  fetch('changes.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { CHANGES = j; paintMeta(); if (S.tab === 'chg') render(); })
    .catch(function () {});
}

/* ── 事件 ── */
var t = null;
$('#q').oninput = function (e) {
  $('#clr').style.display = e.target.value ? 'block' : 'none';
  clearTimeout(t);
  t = setTimeout(function () {
    S.q = e.target.value;
    S.shown = PAGE;
    S.live = null;
    if (S.q.trim()) {
      var local = CACHE ? filtered(CACHE) : [];      // 本機先找（0 延遲）
      if (!local.length) { liveSearch(S.q.trim()); return; }   // 找不到才問 CeX
    }
    render();
  }, 220);
};
$('#clr').onclick = function () { $('#q').value = ''; $('#clr').style.display = 'none'; S.q = ''; S.live = null; render(); $('#q').focus(); };
$('#g1').onchange = function (e) { S.g1 = e.target.value; S.live = null; syncG2(); S.shown = PAGE; render(); };
$('#g2').onchange = function (e) { S.g2 = e.target.value; S.shown = PAGE; render(); };
$('#sort').onchange = function (e) { S.sort = e.target.value; S.shown = PAGE; render(); };
document.querySelectorAll('#stock button').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('#stock button').forEach(function (x) { x.classList.toggle('on', x === b); });
    S.stock = b.dataset.v; S.shown = PAGE; S.live = null; render();
  };
});
document.querySelectorAll('.tabs button').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    S.tab = b.dataset.tab; S.live = null; S.shown = PAGE; render();
  };
});
$('#sync').onclick = doSync;
window.addEventListener('scroll', function () {
  var m = $('#more');
  if (m && window.innerHeight + window.scrollY > document.body.offsetHeight - 400) m.click();
});
boot();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
})();
</script>
