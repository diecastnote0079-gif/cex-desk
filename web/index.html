<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CeX 最新資料</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#262b36;
    --fg:#e9edf5; --dim:#8b93a5; --accent:#4da3ff; --good:#5ddc9a; --warn:#ffb454; --bad:#ff6b6b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:15px;-webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;padding:0 12px 96px;overflow-x:hidden}
  header{padding:14px 0 8px}
  .title{display:flex;align-items:baseline;gap:8px}
  .title h1{font-size:18px;margin:0;letter-spacing:.5px}
  .title .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .meta{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
  .meta b{color:var(--fg);font-weight:600}
  .sticky{position:sticky;top:0;background:linear-gradient(var(--bg) 72%,rgba(15,17,21,.85));padding:8px 0 10px;z-index:5}
  .search{position:relative}
  .search input{width:100%;padding:13px 40px 13px 40px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search .ico{position:absolute;left:13px;top:12px;color:var(--dim)}
  .search .clr{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--dim);font-size:20px;padding:4px 8px;cursor:pointer;display:none}
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0 8px;max-width:100%}
  .tabs button{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--dim);font-size:13.5px;cursor:pointer}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:700}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--dim);min-width:0;max-width:100%}
  select,.chk{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:7px 9px;font-size:13px}
  .ctrls select{flex:1 1 120px;min-width:0;max-width:calc(50% - 4px);overflow:hidden;text-overflow:ellipsis}
  .chk{display:flex;align-items:center;gap:6px;cursor:pointer;flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden}
  .chk{display:flex;align-items:center;gap:6px;cursor:pointer}
  .chk input{accent-color:var(--accent)}
  .count{font-size:12.5px;color:var(--dim);padding:8px 2px 4px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
  .item .main{flex:1;min-width:0}
  .item .nm{font-size:14.5px;line-height:1.35;word-break:break-word}
  .item .sub{font-size:11.5px;color:var(--dim);margin-top:5px;display:flex;flex-wrap:wrap;gap:8px}
  .item .sub span{white-space:nowrap}
  .item .right{text-align:right;flex-shrink:0}
  .price{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .buy{font-size:11.5px;color:var(--good);font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}
  .qty0{color:var(--bad)}
  .q1{color:var(--warn)}
  .chg{display:flex;gap:8px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line)}
  .chg .ev{font-size:11px;border-radius:6px;padding:2px 6px;flex-shrink:0;margin-top:2px}
  .ev.NEW{background:rgba(93,220,154,.15);color:var(--good)}
  .ev.GONE,.ev.SOLD_OUT{background:rgba(255,107,107,.15);color:var(--bad)}
  .ev.PRICE_UP,.ev.PRICE_DOWN,.ev.QTY_UP,.ev.QTY_DOWN,.ev.RESTOCK,.ev.STORE_CHANGE{background:rgba(255,180,84,.15);color:var(--warn)}
  .chg .txt{flex:1;font-size:13.5px;line-height:1.4;min-width:0}
  .chg .txt .n{color:var(--dim);font-size:11.5px;margin-top:3px}
  .dayhd{font-size:12px;color:var(--dim);margin:14px 0 4px;font-weight:600}
  .empty{color:var(--dim);text-align:center;padding:40px 10px;font-size:14px;line-height:1.7}
  .more{display:block;width:100%;margin:12px 0;padding:12px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
  .err{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#ffc9c9;
    padding:12px;border-radius:12px;font-size:13px;line-height:1.6;margin:12px 0}
  footer{margin-top:22px;font-size:11.5px;color:var(--dim);line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><h1>CeX 最新資料</h1><span class="tag">只給事實</span></div>
    <div class="meta" id="meta">載入中…</div>
  </header>

  <div class="sticky">
    <div class="search">
      <span class="ico">🔍</span>
      <input id="q" type="search" placeholder="搜尋遊戲／商品名稱…" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="clr">×</button>
    </div>
    <div class="tabs">
      <button data-tab="all" class="on" title="全部資料">全部</button>
      <button data-tab="new" title="近 24 小時新上架">新上架 24h</button>
      <button data-tab="chg" title="變動紀錄">變動</button>
    </div>
    <div class="ctrls" id="ctrls">
      <select id="cat"><option value="">全部分類</option></select>
      <select id="sort">
        <option value="first-desc">首見 新→舊</option>
        <option value="price-desc">價格 高→低</option>
        <option value="price-asc">價格 低→高</option>
        <option value="name-asc">名稱 A→Z</option>
      </select>
      <label class="chk"><input type="checkbox" id="instock"> 只看有庫存</label>
      <label class="chk"><input type="checkbox" id="onlygame"> 只看遊戲</label>
    </div>
    <div class="count" id="count"></div>
  </div>

  <div id="list"></div>
  <footer>
    資料來源：CeX 公開資料（MY）。<br>
    買取價 = 走進 CeX 可換到的現金（他們的官方數字）。<br>
    這裡只呈現事實，不給建議——判斷留給你。
  </footer>
</div>

<script>
const state = { tab:'all', q:'', cat:'', sort:'first-desc', instock:false, onlygame:false, shown:60, page:60, max:1000 };
let ITEMS = [], IDX = [], CHANGES = null, META = null;
const $ = s => document.querySelector(s);
const fmtRM = n => 'RM' + (Number.isInteger(n) ? n : n.toFixed(2));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy = t => { const s = String(t||'').slice(0,10); return s ? s.slice(2).replace(/-/g,'/') : ''; };
const hoursAgo = t => { const d = Date.parse(String(t||'').replace(' ','T')); return isNaN(d) ? null : (Date.now()-d)/3600e3; };

async function load(){
  try{
    const [meta, data, chg] = await Promise.all([
      fetch('meta.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null),
      fetch('items.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null),
      fetch('changes.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    if(!data) throw new Error('items.json 讀不到');
    META = meta; CHANGES = chg;
    const cols = data.cols || ['boxId','name','cat','price','cash','qty','stores','first'];
    ITEMS = data.items.map(r => { const o = {}; cols.forEach((c,i) => o[c] = r[i]); o._s = String(o.name||'').toLowerCase(); return o; });

    const age = META && META.generatedAt ? hoursAgo(META.generatedAt) : null;
    $('#meta').innerHTML = `資料時間：<b>${META ? new Date(META.generatedAt).toLocaleString('zh-TW',{timeZone:'Asia/Kuala_Lumpur',hour12:false}) : '未知'}</b>`
      + (age != null ? `（${age < 1 ? Math.round(age*60)+' 分鐘' : age.toFixed(1)+' 小時'}前）` : '')
      + `<br>共 <b>${ITEMS.length.toLocaleString()}</b> 筆${META && META.source === 'cloud' ? '｜來源：雲端備援' : ''}`;

    const cats = [...new Set(ITEMS.map(i => i.cat).filter(Boolean))].sort((a,b) => a.localeCompare(b,'zh-Hant'));
    $('#cat').innerHTML = '<option value="">全部分類</option>' + cats.map(c => `<option>${esc(c)}</option>`).join('');
    render();
  }catch(e){
    $('#list').innerHTML = `<div class="err"><b>資料載入失敗</b><br>${esc(e.message)}<br><br>如果一直失敗，跟凜說一聲。</div>`;
    $('#meta').textContent = '載入失敗';
  }
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  const cut = new Date(Date.now() - 86400e3 + 8*3600e3).toISOString().replace(' ','T').slice(0,19);
  let out = ITEMS;
  if(state.tab === 'new') out = out.filter(i => String(i.first||'').replace(' ','T').slice(0,19) >= cut);
  if(q) out = out.filter(i => i._s.includes(q));
  if(state.cat) out = out.filter(i => i.cat === state.cat);
  if(state.instock) out = out.filter(i => i.qty > 0);
  if(state.onlygame) out = out.filter(i => /game|games|accessor/i.test(i.cat || ''));
  const s = state.sort;
  out = out.slice().sort((a,b) =>
    s === 'price-desc' ? b.price - a.price :
    s === 'price-asc'  ? a.price - b.price :
    s === 'first-desc' ? String(b.first||'').localeCompare(String(a.first||'')) :
    String(a.name||'').localeCompare(String(b.name||''),'zh-Hant'));
  return out;
}

function itemRow(i){
  const q = i.qty, st = q <= 0 ? 'qty0' : (q <= 1 ? 'q1' : '');
  const subs = [esc(i.cat||'—')];
  if(i.cash > 0) subs.push(`買取 ${fmtRM(i.cash)}`);
  if(i.stores > 0) subs.push(`${i.stores} 家分店`);
  if(i.first) subs.push(`首見 ${dmy(i.first)}`);
  subs.push(`#${esc(i.boxId)}`);
  return `<div class="item"><div class="main"><div class="nm">${esc(i.name||'(無名)')}</div>
    <div class="sub"><span>${subs.join('</span><span>')}</span></div></div>
    <div class="right"><div class="price">${fmtRM(i.price)}</div>
    <div class="buy ${st}">庫存 ${q}</div></div></div>`;
}

const EVLABEL = {NEW:'新上架',GONE:'消失',SOLD_OUT:'賣光',RESTOCK:'回架',QTY_UP:'庫存+',QTY_DOWN:'庫存−',
  PRICE_UP:'漲價',PRICE_DOWN:'降價',STORE_CHANGE:'分店變動'};

function renderChanges(){
  const rows = (CHANGES && CHANGES.rows) || [];
  if(!rows.length) return `<div class="empty">還沒有變動紀錄。<br>每天電腦抓完就會累積，明早再看。</div>`;
  const byDay = {};
  for(const r of rows){ const d = dmy(r.t) || '—'; (byDay[d] = byDay[d] || []).push(r); }
  return Object.keys(byDay).map(d =>
    `<div class="dayhd">${d}（${byDay[d].length} 筆）</div>` +
    byDay[d].map(r => {
      return `<div class="chg"><span class="ev ${esc(r.event)}">${EVLABEL[r.event] || esc(r.event)}</span>
        <div class="txt">${esc(r.name||r.boxId)}
          <div class="n">${esc(r.cat||'')}${r.old!=null&&r.new!=null?`　${esc(r.old)} → ${esc(r.new)}`:''}</div>
        </div></div>`;
    }).join('')).join('');
}

function render(){
  const list = $('#list');
  if(state.tab === 'chg'){
    $('#count').textContent = '';
    list.innerHTML = renderChanges();
    $('#ctrls').style.display = 'none';
    return;
  }
  $('#ctrls').style.display = '';
  const out = filtered();
  const cap = Math.min(state.shown, state.max);
  $('#count').textContent = `符合 ${out.length.toLocaleString()} 筆` + (out.length > cap ? `，顯示前 ${cap}` : '');
  if(!out.length){ list.innerHTML = `<div class="empty">沒有符合的資料。<br>（空手而回是常態，不用硬找。）</div>`; return; }
  const slice = out.slice(0, cap);
  const more = out.length > cap
    ? (cap >= state.max
        ? `<div class="empty">還有 ${(out.length - cap).toLocaleString()} 筆——用上面的搜尋或分類縮小範圍。</div>`
        : `<button class="more" id="more">載入更多（還有 ${(out.length - cap).toLocaleString()} 筆）</button>`)
    : '';
  list.innerHTML = slice.map(itemRow).join('') + more;
  const m = $('#more');
  if(m) m.onclick = () => { state.shown += 200; render(); };
}

// 事件
let t = null;
$('#q').oninput = e => {
  $('#clr').style.display = e.target.value ? 'block' : 'none';
  clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; state.shown = state.page; render(); }, 140);
};
$('#clr').onclick = () => { $('#q').value = ''; $('#clr').style.display = 'none'; state.q = ''; render(); $('#q').focus(); };
$('#cat').onchange = e => { state.cat = e.target.value; state.shown = state.page; render(); };
$('#sort').onchange = e => { state.sort = e.target.value; state.shown = state.page; render(); };
$('#instock').onchange = e => { state.instock = e.target.checked; state.shown = state.page; render(); };
$('#onlygame').onchange = e => { state.onlygame = e.target.checked; state.shown = state.page; render(); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  state.tab = b.dataset.tab; state.shown = state.page; render();
});
// 支援 deep link：?tab=new / ?tab=chg（方便直接分享／從 Telegram 帶參數進來）
{
  const t = new URLSearchParams(location.search).get('tab');
  if(t && ['all','new','chg'].includes(t)){
    state.tab = t;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
  }
}
window.addEventListener('scroll', () => {
  const m = $('#more');
  if(m && window.innerHeight + window.scrollY > document.body.offsetHeight - 400) m.click();
});
load();
</script>
</body>
</html>
